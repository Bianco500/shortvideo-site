name: check-embeds
on:
  schedule:
    - cron: '0 21 * * 0'   # 毎週月曜 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 埋め込みの取得と生死チェック
        run: npm run fetch-embeds
      - name: キャッシュに差分があればコミット（Cloudflare Pages がこの push でデプロイする）
        run: |
          git config user.name "embed-bot"
          git config user.email "embed-bot@users.noreply.github.com"
          git add src/data/embed-cache.json
          git diff --cached --quiet || (git commit -m "chore: embed-cache を更新（削除検知）" && git push)
